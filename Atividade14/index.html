<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Formulário Principal</title>

<style>

body{
    font-family: Arial, Helvetica, sans-serif;
    background:#0fa9e6;
}

form{
    width:450px;
    margin:30px auto;
    background:#29b6f6;
    padding:20px;
    border:2px solid white;
    color:black;
}

h2{
    text-align:center;
    color:white;
    border-bottom:1px solid white;
    padding-bottom:10px;
}

label{
    display:block;
    margin-top:15px;
    font-weight:bold;
}

input[type=text],
input[type=email],
textarea{
    width:100%;
    padding:8px;
    box-sizing:border-box;
}

textarea{
    height:100px;
    resize:none;
}

.pesquisa{
    text-align:center;
    margin-top:20px;
}

.botoes{
    text-align:center;
    margin-top:20px;
}

</style>

<script>

function validar(){

    var nome = document.nomeform.elements["nome"].value.trim();
    var email = document.nomeform.elements["email"].value.trim();
    var comentario = document.nomeform.elements["comentario"].value.trim();

    if(nome.length < 10){
        alert("O nome deve ter no mínimo 10 caracteres.");
        return false;
    }

    if(email == ""){
        alert("Digite um e-mail.");
        return false;
    }

    if(comentario.length < 20){
        alert("O comentário deve ter no mínimo 20 caracteres.");
        return false;
    }

    var radios = document.nomeform.elements["pesquisa"];
    var resposta = "";

    for(var i=0; i<radios.length; i++){
        if(radios[i].checked){
            resposta = radios[i].value;
        }
    }

    if(resposta == ""){
        alert("Selecione uma opção da pesquisa.");
        return false;
    }

    if(resposta == "sim"){
        alert("Que bom que você voltou a visitar esta página!");
    }else{
        alert("Volte sempre à esta página!");
    }

    return true;

}

</script>

</head>

<body>

<form name="nomeform" onsubmit="return validar()">

<h2>Formulário Principal</h2>

<label>Nome:</label>
<input type="text" name="nome">

<label>E-mail:</label>
<input type="email" name="email">

<label>Comentário:</label>
<textarea name="comentario"></textarea>

<div class="pesquisa">

<h3>Pesquisa</h3>

<p>Primeira vez nesta página?</p>

<input type="radio" name="pesquisa" value="sim"> Sim
<input type="radio" name="pesquisa" value="nao"> Não

</div>

<div class="botoes">

<input type="submit" value="Enviar">
<input type="reset" value="Limpar">

</div>

</form>

</body>
</html>
